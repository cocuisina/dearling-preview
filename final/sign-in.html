<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dearling, sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 38 38%27%3E%3Ccircle cx=%2719%27 cy=%279%27 r=%276%27 fill=%27%230f6b5c%27/%3E%3Ccircle cx=%278%27 cy=%2728%27 r=%276%27 fill=%27%230f6b5c%27/%3E%3Ccircle cx=%2730%27 cy=%2728%27 r=%276%27 fill=%27%238fe0cc%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="dearling.css">
</head>
<body class="signin">
<div class="si-photo onphoto">
  <img src="assets/hero-porch.jpg" alt="The family around a porch table while Arthur tells a story">
  <a class="brand" href="index.html"><svg viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="9" r="6" fill="currentColor"/><circle cx="8" cy="28" r="6" fill="currentColor"/><circle cx="30" cy="28" r="6" fill="#8fe0cc"/><path d="M19 15 C19 22 8 20 8 22 M19 15 C19 22 30 20 30 22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg> Dearling</a>
</div>
<main class="si-form">
  <h1>Welcome back.</h1>
  <p class="hint">We will email you a sign-in link. There is no password.</p>
  <form action="app-home.html" novalidate>
    <label for="email">Your email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="rosa@example.com" inputmode="email">
    <button class="btn btn-primary" type="submit">Email me a sign-in link</button>
  </form>
  <p class="fine">Dearling is pre-launch, so this preview skips the email and takes you straight in as Rosa.</p>
  <a class="link" href="index.html">Back to the Dearling home page</a>
</main>
</body>
</html>
